            emissionStrength: 0,
          }
        - {
            id: wall,
            baseColor: [0.14, 0.15, 0.17, 1],
            roughness: 0.82,
            metallic: 0,
            emission: [0, 0, 0],
            emissionStrength: 0,
          }
        - {
            id: partition,
            baseColor: [0.09, 0.095, 0.11, 1],
            roughness: 0.7,
            metallic: 0,
            emission: [0, 0, 0],
            emissionStrength: 0,
          }
        - {
            id: plinth,
            baseColor: [0.2, 0.21, 0.23, 1],
            roughness: 0.45,
            metallic: 0.18,
            emission: [0, 0, 0],
            emissionStrength: 0,
          }
        - {
            id: side-plinth,
            baseColor: [0.16, 0.17, 0.19, 1],
            roughness: 0.52,
            metallic: 0.08,
            emission: [0, 0, 0],
            emissionStrength: 0,
          }
        - {
            id: monolith,
            baseColor: [0.015, 0.02, 0.028, 1],
            roughness: 0.16,
            metallic: 0.78,
            emission: [0.01, 0.035, 0.06],
            emissionStrength: 0.7,
          }
        - {
            id: amber-light,
            baseColor: [0.95, 0.3, 0.04, 1],
            roughness: 0.12,
            metallic: 0.05,
            emission: [1, 0.12, 0.015],
            emissionStrength: 4,
          }
        - {
            id: blue-light,
            baseColor: [0.08, 0.5, 0.95, 1],
