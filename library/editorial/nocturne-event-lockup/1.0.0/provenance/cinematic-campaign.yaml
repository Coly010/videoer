schemaVersion: 1
id: campaign.nocturne-exhibition
fps: 24
resolution: { width: 480, height: 270, percentage: 100 }
assetLibrary: ../../library

geometry:
  - id: gallery
    path: work/gallery/geometry.json
    recipe:
      assetId: environment.nocturne-gallery
      metadata:
        generator: videoer.declarative-geometry.v1
        venueClass: contemporary-exhibition-hall
        projectOwned: true
      primitives:
        - { kind: box, minimum: [-6, -0.18, -6], maximum: [6, 0, 5], materialId: floor }
        - { kind: box, minimum: [-6, 0, 4.8], maximum: [6, 4.5, 5], materialId: wall }
        - { kind: box, minimum: [-6, 0, -6], maximum: [-5.8, 4.5, 5], materialId: wall }
        - { kind: box, minimum: [5.8, 0, -6], maximum: [6, 4.5, 5], materialId: wall }
        - { kind: box, minimum: [-4.8, 0, 1.8], maximum: [-2.3, 3.6, 2], materialId: partition }
        - { kind: box, minimum: [2.3, 0, 1.8], maximum: [4.8, 3.6, 2], materialId: partition }
        - { kind: box, minimum: [-1.1, 0, -0.5], maximum: [1.1, 0.3, 0.7], materialId: plinth }
        - {
            kind: box,
            minimum: [-0.22, 0.3, -0.05],
            maximum: [0.22, 3.1, 0.25],
            materialId: monolith,
          }
        - {
            kind: capsule,
            start: [-1.25, 0.35, 0.2],
            end: [-0.35, 2.75, 0.2],
            radiusX: 0.11,
            radiusZ: 0.11,
            materialId: amber-light,
          }
        - {
            kind: capsule,
            start: [1.25, 0.35, 0.2],
            end: [0.35, 2.75, 0.2],
            radiusX: 0.11,
            radiusZ: 0.11,
            materialId: blue-light,
          }
        - {
            kind: capsule,
            start: [-0.95, 2.55, 0.2],
            end: [0.95, 2.55, 0.2],
            radiusX: 0.1,
            radiusZ: 0.1,
            materialId: pearl-light,
          }
        - {
            kind: box,
            minimum: [-4.2, 0, -1.4],
            maximum: [-2.9, 0.75, -0.5],
            materialId: side-plinth,
          }
        - {
            kind: capsule,
            start: [-3.7, 0.75, -0.95],
            end: [-3.3, 2.2, -0.95],
            radiusX: 0.28,
            radiusZ: 0.18,
            materialId: cobalt,
          }
        - {
            kind: box,
            minimum: [2.9, 0, -1.4],
            maximum: [4.2, 0.75, -0.5],
            materialId: side-plinth,
