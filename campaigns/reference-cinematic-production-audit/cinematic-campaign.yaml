      - { id: canopy, geometry: shop-canopy, role: set-dressing, transform: { position: [2.15, 3.18, -0.02], rotation: [0, 0, 0], scale: [1, 1, 1] } }
      - { id: sign, geometry: shop-sign, role: set-dressing, transform: { position: [4.15, 3.45, -0.02], rotation: [0, 0, 0], scale: [1, 1, 1] } }
