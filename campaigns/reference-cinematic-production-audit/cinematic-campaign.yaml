schemaVersion: 1
id: campaign.reference-cinematic-production-audit
fps: 24
resolution: { width: 540, height: 960, percentage: 100 }
assetLibrary: ../../library

materialSources:
  - id: wet-cobble-surface
    library:
      type: material
      query: wet old city cobble procedural surface
      tags: [stone, cobble, wet]
      capabilities: [procedural, albedo, normal, roughness]
      preferredAsset: { id: material.wet-old-city-cobble, version: 0.1.0 }
      artifactRole: material
  - id: rain-aged-plaster-surface
    library:
      type: material
      query: rain aged mineral plaster
      tags: [plaster, exterior, weathered]
      capabilities: [procedural, albedo, normal, roughness, object-space-metre-scale]
      preferredAsset: { id: material.rain-aged-mineral-plaster, version: 0.2.0 }
      artifactRole: material
  - id: dark-brick-surface
    library:
      type: material
      query: old city dark brick
      tags: [brick, masonry, old-city, wet]
      capabilities: [procedural, albedo, normal, roughness, object-space-metre-scale]
      preferredAsset: { id: material.old-city-dark-brick, version: 0.2.0 }
      artifactRole: material
  - id: weathered-wood-surface
    library:
      type: material
      query: weathered dark exterior wood
      tags: [wood, exterior, weathered]
      capabilities: [procedural, albedo, normal, roughness, object-space-metre-scale]
      preferredAsset: { id: material.weathered-dark-exterior-wood, version: 0.2.0 }
      artifactRole: material
  - id: oiled-interior-wood-surface
    library:
      type: material
      query: oiled dark bookshop wood
      tags: [wood, interior, shelving, bookshop]
      capabilities: [procedural, albedo, normal, roughness, object-space-metre-scale]
      preferredAsset: { id: material.oiled-dark-bookshop-wood, version: 0.2.0 }
      artifactRole: material
  - id: window-glazing-surface
    library:
      type: material
      query: old city physical window glazing
      tags: [glass, window, old-city]
      capabilities: [procedural, albedo, normal, roughness, object-space-metre-scale]
      preferredAsset: { id: material.old-city-window-glazing, version: 0.2.0 }
      artifactRole: material
  - id: warm-interior-plaster-surface
    library:
      type: material
      query: warm lime plaster interior
      tags: [plaster, interior, warm]
      capabilities: [procedural, albedo, normal, roughness, object-space-metre-scale]
      preferredAsset: { id: material.warm-lime-plaster-interior, version: 0.2.0 }
      artifactRole: material

geometry:
  - id: bookshop
    path: work/geometry/bookshop-production-surfaces.json
    materialBindings:
      - { targetMaterialId: wet-cobble, material: wet-cobble-surface }
      - { targetMaterialId: wet-cobble-1, material: wet-cobble-surface }
      - { targetMaterialId: wet-cobble-2, material: wet-cobble-surface }
      - { targetMaterialId: wet-cobble-3, material: wet-cobble-surface }
      - { targetMaterialId: neighbour-plaster, material: rain-aged-plaster-surface }
      - { targetMaterialId: opposite-plaster, material: rain-aged-plaster-surface }
      - { targetMaterialId: dark-brick, material: dark-brick-surface }
      - { targetMaterialId: wood, material: weathered-wood-surface }
      - { targetMaterialId: shelf-wood, material: oiled-interior-wood-surface }
      - { targetMaterialId: counter-wood, material: oiled-interior-wood-surface }
      - { targetMaterialId: glass, material: window-glazing-surface }
      - { targetMaterialId: dark-window, material: window-glazing-surface }
      - { targetMaterialId: warm-plaster, material: warm-interior-plaster-surface }
    library:
      type: environment
      query: continuous old city bookshop street and interior
      tags: [old-city, bookshop, warm-interior]
      capabilities:
        [deterministic-seed, exterior-continuity, named-interaction-points, opposing-street-depth]
      preferredAsset: { id: environment.old-city-bookshop, version: 0.2.1 }
      artifactRole: geometry
  - id: elara
    library:
      type: character
      query: Elara Vale recurring heroine
      tags: [humanoid, woman, recurring]
      capabilities:
        [
          canonical-humanoid-rig,
          skinned-mesh,
          identity-reference,
          motion-retargeting,
          long-dress-drape-skinning,
        ]
      preferredAsset: { id: character.elara-vale, version: 0.1.4 }
      artifactRole: geometry
  - id: door
    library:
      type: prop
      query: articulated glazed bookshop door
      tags: [wooden, glazed, bookshop, door]
      capabilities: [hinge, handle-interaction-point, collision-volume]
      preferredAsset: { id: prop.bookshop-door, version: 0.1.0 }
      artifactRole: geometry
  - id: book
    library:
      type: prop
      query: significant articulated hardback book
      tags: [book, hardback, significant]
      capabilities: [openable-cover, left-hand-grip, right-hand-grip, gaze-target]
      preferredAsset: { id: prop.significant-book, version: 0.1.0 }
      artifactRole: geometry
  - id: cover
    library:
      type: prop
      query: Rise of Demons dimensional campaign cover
      tags: [cover, campaign-supplied]
      capabilities: [front-texture, dimensional-reveal]
      preferredAsset: { id: prop.rise-of-demons-cover, version: 0.1.0 }
      artifactRole: geometry
  - id: modular-hair
    library:
      type: hair
      query: pulled back low bun modular canonical hair
      tags: [hair, pulled-back, low-bun, canonical-humanoid]
      capabilities: [separable-hair-geometry, canonical-head-anchor, layered-flow-cards]
      preferredAsset: { id: hair.pulled-back-low-bun, version: 0.7.0 }
      artifactRole: geometry
  - id: storage-barrel
    library:
      type: prop
      query: weathered portable street barrel
      tags: [set-dressing, storage, portable]
      capabilities: [portable-geometry, ground-placement]
      preferredAsset: { id: prop.storage-barrel, version: 0.1.0 }
      artifactRole: geometry
  - id: storage-crate
    library:
      type: prop
      query: slatted portable street crate
      tags: [set-dressing, storage, portable]
      capabilities: [portable-geometry, ground-placement]
      preferredAsset: { id: prop.slatted-storage-crate, version: 0.1.0 }
      artifactRole: geometry
  - id: shop-canopy
    library:
      type: prop
      query: projecting supported old city canopy
      tags: [architecture, canopy, shopfront, portable-set-dressing]
      capabilities: [portable-geometry, vertical-facade-canopy-host-contract]
      preferredAsset: { id: prop.projecting-supported-canopy, version: 0.1.0 }
      artifactRole: geometry
  - id: shop-sign
    library:
      type: prop
      query: projecting hanging shop sign
      tags: [signage, shop-sign, facade]
      capabilities: [portable-geometry, vertical-facade-host-contract]
      preferredAsset: { id: prop.projecting-hanging-sign, version: 0.1.0 }
      artifactRole: geometry
  - id: wall-lantern
    library:
      type: prop
      query: old city wall lantern practical
      tags: [lantern, wall-light, practical, old-city]
      capabilities: [portable-geometry, physical-glazing, local-practical-emitter]
      preferredAsset: { id: prop.old-city-wall-lantern, version: 0.5.0 }
      artifactRole: geometry
  - id: potted-fern
    library:
      type: prop
      query: portable potted fern
      tags: [vegetation, planter, portable]
      capabilities: [portable-geometry, ground-placement]
      preferredAsset: { id: prop.potted-fern, version: 0.1.0 }
      artifactRole: geometry
  - id: reading-chair
    library:
      type: prop
      query: upholstered reading chair
      tags: [chair, seating, interior-furnishing]
      capabilities: [physical-seating-silhouette, occupant-anchor]
      preferredAsset: { id: prop.upholstered-reading-chair, version: 0.1.0 }
      artifactRole: geometry
  - id: side-table
    library:
      type: prop
      query: pedestal side table
      tags: [table, pedestal, interior-furnishing]
      capabilities: [physical-tabletop, tabletop-anchors]
      preferredAsset: { id: prop.pedestal-side-table, version: 0.1.0 }
      artifactRole: geometry
  - id: vessel-set
    library:
      type: prop
      query: decorative vessel set
      tags: [vessels, ceramic, tabletop]
      capabilities: [tabletop-inventory, physical-vessels]
      preferredAsset: { id: prop.decorative-vessel-set, version: 0.1.0 }
      artifactRole: geometry

lightingSources:
  - id: exterior-lighting
    library:
      type: lighting
      query: moonlit night exterior lighting rig with warm practical depth
      tags: [lighting-rig, moonlight, night-exterior, warm-practical]
      capabilities:
        [reusable-rig, coherent-exposure, directional-moon-key, night-sky-fill, warm-aperture-depth-cue]
      preferredAsset: { id: lighting.moonlit-exterior, version: 0.1.0 }
      artifactRole: lighting-rig
  - id: interior-lighting
    library:
      type: lighting
      query: warm bookshop interior lighting rig
      tags: [lighting-rig, warm-interior, cool-fill]
      capabilities: [reusable-rig, face-key, coherent-exposure]
      preferredAsset: { id: lighting.bookshop-warm-interior, version: 0.1.0 }
      artifactRole: lighting-rig

vfxSources:
  - id: rainy-dusk
    library:
      type: vfx
      query: camera depth rainy dusk atmosphere
      tags: [rain, fog, dusk]
      capabilities:
        [camera-depth, deterministic-seed, foreground-background, wind-driven-streaks, world-space-surface-response]
      preferredAsset: { id: vfx.rainy-dusk-depth, version: 0.2.0 }
      artifactRole: vfx

finishSources:
  - id: atmospheric-finish
    library:
      type: vfx
      query: restrained soft atmospheric cinematic finish
      tags: [cinematic-finish, grading, bloom, vignette, grain]
      capabilities:
        [renderer-independent-finish-profile, deterministic-ffmpeg-reconstruction, warm-cool-source-transfer]
      preferredAsset: { id: vfx.soft-atmospheric-finish, version: 0.1.0 }
      artifactRole: finish-profile

audioSources:
  - id: rainy-bookshop-score
    library:
      type: audio
      query: deterministic rainy bookshop score and sound design
      tags: [rain, cinematic-score, foley, deterministic]
      capabilities: [provider-free, frame-synchronized, stereo-48khz, exact-duration]
      preferredAsset: { id: audio.rainy-bookshop-score, version: 0.1.0 }
      artifactRole: master

overlays:
  - id: title-treatment
    library:
      type: material
      query: Rise of Demons restrained editorial title treatment
      tags: [typography, title, editorial]
      capabilities: [vertical-safe-area, deterministic-render]
      preferredAsset: { id: material.rise-of-demons-title-treatment, version: 0.1.1 }
      artifactRole: transparent-overlay

motions:
  - id: cautious-walk
    path: work/motions/current-cautious-walk-v4.json
    recipe: { kind: walk-style, style: cautious }
  - id: window-head-turn
    path: work/motions/window-head-turn.json
    recipe:
      kind: targeted-turn
      actorTransform:
        { position: [2.2, 0, -1.3], rotation: [0, 1.5707963267948966, 0], scale: [1, 1, 1] }
      target: { geometry: bookshop, attachmentId: window-gaze-target }
      scope: head
      durationSeconds: 1.05
      maximumYawRadians: 0.7853981633974483
  - id: window-body-turn
    path: work/motions/window-body-turn.json
    recipe:
      kind: targeted-turn
      actorTransform:
        { position: [1.5, 0, -1.3], rotation: [0, 1.5707963267948966, 0], scale: [1, 1, 1] }
      target: { geometry: bookshop, attachmentId: window-gaze-target }
      scope: head-and-body
      durationSeconds: 1.5833333333333333
      maximumYawRadians: 1.1309733552923256
  - id: open-door-actor
    library:
      type: motion
      query: phased bookshop door interaction actor motion
      tags: [door, reach, interaction]
      capabilities: [canonical-humanoid, hand-ik, target-resolution, phase-sequencing, root-motion]
      preferredAsset: { id: motion.open-bookshop-door, version: 0.2.0 }
      artifactRole: actor-motion
  - id: open-door-target
    library:
      type: motion
      query: phased bookshop door interaction target motion
      tags: [door, reach, interaction]
      capabilities: [canonical-humanoid, hand-ik, target-resolution, phase-sequencing, root-motion]
      preferredAsset: { id: motion.open-bookshop-door, version: 0.2.0 }
      artifactRole: target-motion
  - id: read-book-actor
    library:
      type: motion
      query: two handed book raise and read actor motion
      tags: [book, hold, read]
      capabilities: [canonical-humanoid, two-hand-ik, prop-attachment, gaze-target]
      preferredAsset: { id: motion.read-significant-book, version: 0.1.0 }
      artifactRole: actor-motion
  - id: read-book-target
    library:
      type: motion
      query: two handed book raise and read target motion
      tags: [book, hold, read]
      capabilities: [canonical-humanoid, two-hand-ik, prop-attachment, gaze-target]
      preferredAsset: { id: motion.read-significant-book, version: 0.1.0 }
      artifactRole: target-motion

motionTimelines:
  - id: approach-performance
    clipId: motion.reference-benchmark.approach
    path: work/motions/approach-performance.json
    frames: 58
    layers:
      - { id: walk, motion: cautious-walk, mode: base, startFrame: 0, endFrame: 58, playback: loop }
    metadata: { purpose: Elara-proportioned cautious profile travel }
  - id: attraction-performance
    clipId: motion.reference-benchmark.attraction
    path: work/motions/attraction-performance.json
    frames: 43
    layers:
      - { id: walk, motion: cautious-walk, mode: base, startFrame: 0, endFrame: 43, playback: once }
      - {
          id: turn,
          motion: window-head-turn,
          mode: additive,
          startFrame: 18,
          endFrame: 43,
          playback: once,
          fadeInFrames: 3,
          joints: [neck, head],
        }
    metadata: { purpose: Walking attention turn toward semantic shop window target }
  - id: pause-performance
    clipId: motion.reference-benchmark.pause
    path: work/motions/pause-performance.json
    frames: 38
    layers:
      - {
          id: grounded-hold,
          motion: cautious-walk,
          mode: base,
          startFrame: 0,
          endFrame: 38,
          playback: hold,
          sourceStartSeconds: 0,
        }
      - {
          id: turn,
          motion: window-body-turn,
          mode: additive,
          startFrame: 0,
          endFrame: 38,
          playback: once,
        }
    metadata: { purpose: Grounded target-derived body orientation }

soundtrackPath: work/audio/soundtrack.wav
soundtrack:
  schemaVersion: 1
  id: audio.reference-cinematic-production-audit
  durationSeconds: 15
  sampleRate: 48000
  channels: 2
  cues:
    - {
        id: complete-score,
        kind: audio-source,
        source: rainy-bookshop-score,
        startSeconds: 0,
        endSeconds: 15,
        gain: 1,
        purpose: Reuse the verified frame-synchronised benchmark score and foley master,
      }
  metadata: { providerFree: true, sourceAsset: audio.rainy-bookshop-score@0.1.0 }

shots:
  - id: city-establish
    frames: 34
    entities:
      - { id: bookshop-set, geometry: bookshop, role: environment }
      - { id: canopy, geometry: shop-canopy, role: set-dressing, transform: { position: [2.15, 3.18, -0.02], rotation: [0, 0, 0], scale: [1, 1, 1] } }
      - { id: sign, geometry: shop-sign, role: set-dressing, transform: { position: [4.15, 3.45, -0.02], rotation: [0, 0, 0], scale: [1, 1, 1] } }
      - { id: lantern, geometry: wall-lantern, role: set-dressing, transform: { position: [-2.2, 2.85, -0.02], rotation: [0, 0, 0], scale: [1, 1, 1] } }
      - { id: barrel, geometry: storage-barrel, role: set-dressing, transform: { position: [-3.75, 0, -2.35], rotation: [0, 0.22, 0], scale: [1, 1, 1] } }
      - { id: crate, geometry: storage-crate, role: set-dressing, transform: { position: [-4.28, 0, -2.2], rotation: [0, -0.16, 0], scale: [1, 1, 1] } }
      - { id: fern, geometry: potted-fern, role: set-dressing, transform: { position: [3.75, 0, -0.48], rotation: [0, -0.3, 0], scale: [0.78, 0.78, 0.78] } }
    camera:
      keyframes:
        - {
            time: 0,
            position: { world: [8.2, 3.45, -2.7] },
            target: { world: [-1.8, 1.45, -2.1] },
            lensMillimeters: 46,
          }
        - {
            time: 1.4166666666666667,
            position: { world: [7.1, 3.15, -2.62] },
            target: { world: [-2.4, 1.42, -2.05] },
            lensMillimeters: 52,
