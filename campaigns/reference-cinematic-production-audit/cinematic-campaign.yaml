      - { id: settle, progress: 1, description: Camera settles with street and shop readable }
    metadata: { campaignClass: reference-cinematic, grammar: environmental-establish }

  - id: character-approach
    frames: 58
    entities:
      - { id: bookshop-set, geometry: bookshop, role: environment }
      - id: elara
